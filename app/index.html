<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="لاقي: اسأل عن توفر الأدوية في السودان وترد عليك صيدليات موثّقة.">
  <meta name="theme-color" content="#0B7A66">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>لاقي</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #F2F6F4; }
    @media (prefers-color-scheme: dark) { html, body { background: #0A1411; } }
    #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #boot i { display: block; width: 74px; height: 28px; border-radius: 14px;
      background: linear-gradient(90deg, #fff 50%, #FFB020 50%); box-shadow: 0 0 0 1px rgba(5,63,55,.12);
      transform: rotate(-45deg); animation: sway 1.4s ease-in-out infinite; }
    @keyframes sway { 50% { transform: rotate(-20deg) translateY(-6px); } }
    @media (prefers-reduced-motion: reduce) { #boot i { animation: none; } }
  </style>
</head>
<body>
  <div id="boot"><i></i></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
